<div class="row">
    <div class="col-md-12">
        <nb-card>
            <nb-card-body>
                <h2 class="title">Not Authorized</h2>
                <small class="sub-title">The account you have tried to sign in with has not been registered.</small>
                <button nbButton status="primary" (click)="goToLogin()" type="button" class="login-button">
                    Retry
                </button>
            </nb-card-body>
        </nb-card>
    </div>
</div>
