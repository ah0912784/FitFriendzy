<!-- Basic layout / ideas -->

<h1>Users Page</h1>
<p>For Admin Purposes Only</p>

<nb-accordion multi>
  <nb-accordion-item>
    <nb-accordion-item-header>
      Create User
    </nb-accordion-item-header>
    <nb-accordion-item-body>
      <nb-card>
        <nb-card-body>
          <nb-card>
            <nb-card-body>
              <form (ngSubmit)="onSubmit()" #userForm="ngForm">
                <div class="form-group">
                  <label for="fname">First Name: </label>
                  <input type="text" id="fname" [(ngModel)]="newUser.firstName" required nbInput placeholder="First Name">
                </div>

                <div class="form-group">
                  <label for="lname">Last name: </label>
                  <input type="text" id="lname" [(ngModel)]="newUser.lastName" required nbInput placeholder="Last Name">
                </div>

                <div class="form-group">
                  <label for="dname">Display name: </label>
                  <input type="text" id="dname" [(ngModel)]="newUser.userDisplayName" required nbInput placeholder="Display Name">
                </div>


                <div class="form-group">
                  <label for="uname">Username: </label>
                  <nb-form-field>
                    <nb-icon nbPrefix icon="at-outline" pack="eva"></nb-icon>
                    <input type="text" id="uname" [(ngModel)]="newUser.userName" required nbInput placeholder="Username">
                  </nb-form-field>
                </div>

                <div class="form-group">
                  <label for="email">E-mail: </label>
                  <input type="text" id="email" [(ngModel)]="newUser.email" required nbInput placeholder="E-Mail">
                </div>

                <div class="form-group">
                  <label for="phone_number">Phone Number: </label>
                  <input type="text" id="phone_number" [(ngModel)]="newUser.phoneNumber" required nbInput placeholder="Phone Number">
                </div>

                <button type="submit" nbButton class="btn btn-success" [disabled]="!userForm.form.valid">Submit</button>
                <button type="button" nbButton class="btn btn-default" (click)="newUserModel(); userForm.reset()">New Hero</button>
              </form>
            </nb-card-body>
          </nb-card>
        </nb-card-body>
      </nb-card>
    </nb-accordion-item-body>
  </nb-accordion-item>

  <nb-accordion-item>
    <nb-accordion-item-header>
      View Users
    </nb-accordion-item-header>
    <nb-accordion-item-body>
      <nb-card>
        <nb-card-body>

          <table [nbTreeGrid]="dataSource" nbSort (sort)="changeSort($event)" equalColumnsWidth>

            <tr nbTreeGridHeaderRow *nbTreeGridHeaderRowDef="allColumns"></tr>
            <tr nbTreeGridRow *nbTreeGridRowDef="let row; columns: allColumns"></tr>

            <ng-container [nbTreeGridColumnDef]="customColumn">
              <th nbTreeGridHeaderCell [nbSortHeader]="getDirection(customColumn)" *nbTreeGridHeaderCellDef>
                {{customColumn}}
              </th>

              <td nbTreeGridCell *nbTreeGridCellDef="let row">

                <!--<nb-tree-grid-row-toggle [expanded]="row.expanded"
                                   *ngIf="row.data.kind === 'dir'">
          </nb-tree-grid-row-toggle>-->
                {{row.data.userId}}

              </td>
            </ng-container>

            <ng-container *ngFor="let column of defaultColumns" [nbTreeGridColumnDef]="column">
              <th nbTreeGridHeaderCell [nbSortHeader]="getDirection(column)" *nbTreeGridHeaderCellDef>
                {{column}}
              </th>

              <td nbTreeGridCell *nbTreeGridCellDef="let row">{{row.data[column]}}</td>
            </ng-container>

          </table>

        </nb-card-body>
      </nb-card>
    </nb-accordion-item-body>
  </nb-accordion-item>
</nb-accordion>
