<div class="create-activity">
    <form [formGroup]="inputForm" (ngSubmit)="onSubmit()">
        <!-- Activity -->
        <div class="form-group">
          <label for="activity">Activity: </label>
          <input #autoInput nbInput type="text" id="activity" (input)="onChange()" placeholder="Select Activity"
                  [nbAutocomplete]="auto" />
          <nb-autocomplete #auto (selectedChange)="onSelectionChange($event)">
            <nb-option *ngFor="let option of filteredOptions$ | async" [value]="option">
              {{ option }}
            </nb-option>
          </nb-autocomplete>
        </div>

        <!-- Duration -->
        <div class="form-group">
          <label for="duration">Duration (Minutes): </label>
          <input type="number" id="duration" placeholder="Enter Time (Minutes)" formControlName="duration" nbInput>
        </div>

        <!-- Points -->
        <div class="form-group">
          <label for="points">Points: </label>
          <input type="number" id="points" formControlName="points" nbInput>
          </div>
          <div>
          <button nbButton status="primary" type="submit">Submit</button>
        </div>
    </form>
</div>
