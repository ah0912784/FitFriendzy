<!-- Basic layout / ideas -->

<nb-card>
  <nb-card-header>Create a New Group</nb-card-header>
  <nb-card-body>
    <form [formGroup]="groupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="groupName">Group Name: </label>
        <input type="text" nbInput fullWidth id="groupName" formControlName="groupName">

        <div *ngIf="groupForm.get('groupName').hasError('required') && groupForm.get('groupName').touched">
          Group name is required.
        </div>
        <div *ngIf="groupForm.get('groupName').hasError('maxlength') && groupForm.get('groupName').touched">
          Maximum length is 50 characters.
        </div>
      </div>
      <button nbButton status="primary" type="submit">Submit</button>
    </form>
  </nb-card-body>
</nb-card>
