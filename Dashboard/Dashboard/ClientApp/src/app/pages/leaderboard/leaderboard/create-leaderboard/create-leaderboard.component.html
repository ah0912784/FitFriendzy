<nb-card size ="medium">
  <nb-card-header>{{ name }}'s Leader Board</nb-card-header>
  <nb-list>
    <!-- Add in ngFor to iterate through members and create leader board -->
    <nb-list-item *ngFor="board of leaderboard">{{board.position}} {{board.name}}  {{board.score}}</nb-list-item>
  </nb-list>
</nb-card>
